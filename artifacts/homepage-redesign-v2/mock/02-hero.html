<meta charset="utf-8" />
<link rel="stylesheet" href="base.css" />
<style>
  .bar {
    position: relative;
    z-index: 4;
    height: 64px;
    border-bottom: 1px solid var(--line);
  }
  .bar-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: min(var(--content-max), calc(100% - 96px));
    height: 100%;
    margin: 0 auto;
  }
  .nav {
    display: flex;
    gap: 34px;
    font-size: 14.5px;
    color: var(--text-2);
  }
  .nav a,
  .brand {
    color: inherit;
    text-decoration: none;
  }
  .brand {
    display: flex;
    align-items: center;
  }
  .brand-logo {
    display: block;
    width: 84px;
    height: auto;
  }
  .hero {
    position: relative;
    height: 772px;
    overflow: hidden;
  }
  .media {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  .media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 50%;
    filter: saturate(0.78) contrast(1.03) brightness(0.86);
  }
  .media::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      rgba(10, 10, 10, 0.04) 0%,
      rgba(10, 10, 10, 0.1) 52%,
      rgba(10, 10, 10, 0.44) 100%
    );
  }
  .glow {
    display: none;
  }
  .copy {
    position: absolute;
    left: 50%;
    top: 43.5%;
    width: min(920px, calc(100% - 160px));
    text-align: center;
    transform: translate(-50%, -50%);
    z-index: 3;
  }
  .copy .d1 {
    max-width: 920px;
    margin-left: auto;
    margin-right: auto;
  }
  .copy .d1 span {
    display: block;
    white-space: nowrap;
  }
  .copy .lead {
    margin-left: auto;
    margin-right: auto;
  }
  .cta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    margin-top: 44px;
  }
  @media (max-width: 900px) {
    .bar-inner {
      width: calc(100% - 40px);
    }
    .nav {
      display: none;
    }
    .brand-logo {
      width: 76px;
    }
    .hero {
      min-height: 700px;
      height: calc(100dvh - 64px);
    }
    .copy {
      top: 47%;
      width: calc(100% - 40px);
    }
    .copy .d1 {
      font-size: 48px !important;
    }
    .copy .d1 span {
      white-space: normal;
    }
  }
</style>
<div class="frame">
  <div class="bar">
    <div class="bar-inner">
      <a class="brand" href="#top" aria-label="JE Labs home">
        <img class="brand-logo" src="../img/assets/logo.png" alt="JE Labs" width="1093" height="512" />
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="#approach">Approach</a><a href="#work">Work</a
        ><a href="#team">Team</a><a href="#insights">Insights</a>
      </nav>
      <a class="btn btn--primary" href="#contact" style="height: 40px; font-size: 14px; padding: 0 20px"
        >Start a conversation</a
      >
    </div>
  </div>

  <div class="hero">
    <div class="media"><img src="../img/assets/hero-auditorium-fullbleed-v2.webp" alt="" /></div>
    <div class="glow"></div>
    <div class="copy">
      <p class="label" style="color: var(--accent)">Strategic growth partner for frontier tech builders</p>
      <h1 class="d1" style="font-size: 70px; margin-top: 28px">
        <span>Make the market</span>
        <span>want what you built</span>
      </h1>
      <p class="lead" style="margin-top: 30px; max-width: 44ch">
        We run market entry, narrative, global media, and KOL marketing for AI, crypto,
        and technology companies.
      </p>
      <div class="cta">
        <a class="btn btn--primary" href="#contact">Start a conversation</a>
        <a class="btn btn--text" href="#work">See our work</a>
      </div>
    </div>
  </div>
</div>
