<meta charset="utf-8" />
<link rel="stylesheet" href="base.css" />
<style>
  .logos {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0;
  }
  .logos img {
    height: 30px;
    opacity: 0.62;
    filter: grayscale(1) brightness(2.4);
  }
  .logos .word {
    font-size: 23px;
    letter-spacing: -0.02em;
    font-weight: 500;
    color: rgba(237, 239, 238, 0.62);
  }
  .nums {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid var(--line);
  }
  .nums > div {
    padding: 44px 34px 46px 0;
  }
  .nums > div + div {
    border-left: 1px solid var(--line);
    padding-left: 34px;
  }
  .nums p.small {
    margin-top: 12px;
    max-width: 22ch;
  }
</style>
<div class="frame">
  <div class="caption">Proof strip / 客户 logo 墙（无标题，无数字）</div>
  <div class="wrap" style="padding-top: 58px; padding-bottom: 62px">
    <div class="logos">
      <span class="word">PublicAI</span>
      <img src="../img/assets/surf.svg" alt="SURF AI" />
      <img src="../img/assets/moss.webp" alt="MOSS AI" style="height: 26px" />
      <img src="../img/assets/minimax-api-logo.svg" alt="MiniMax" />
      <img src="../img/assets/baidu ai.png" alt="Baidu AI" style="height: 24px" />
    </div>

  </div>
</div>
